server:
  port: 8099

spring:
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      enabled: true
      max-file-size: 2048MB
      max-request-size: 2048MB
      file-size-threshold: 10MB
  datasource:
    # 默认连接；也可在页面「MySQL 设置」中改，保存后写入 ~/.nginx-log-analyzer/db.json（会覆盖此处）
    url: jdbc:mysql://localhost:3306/nginx_log?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 1234.com.CN
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

nginx-log:
  # 可选：按路径导入时的默认文件；一般用页面上传即可
  default-file:
  batch-size: 2000
  upload-dir: ${user.home}/.nginx-log-analyzer/uploads
  # 默认无标签；由看板「IP 标签」或首页编辑写入 ~/.nginx-log-analyzer/ip-labels.json
  ip-labels: []

logging:
  level:
    root: INFO
    com.gwamcc.nginxlog: INFO
